# Local database for development and tests:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tiri_relay
      MYSQL_USER: tiri
      MYSQL_PASSWORD: tiri
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mysql:
